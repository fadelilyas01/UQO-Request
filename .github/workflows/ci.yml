name: CI/CD Pipeline - UQO-Requests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Moindre privilege pour GitHub Actions (DevSecOps Rule 5.3)
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. FRONTEND: Validation & Compilation Vite
  # ===========================================================================
  frontend-ci:
    name: Frontend (Node.js & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Compilation de production (Vite build)
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Vérification de l'intégrité du build
        run: test -f dist/index.html

  # ===========================================================================
  # 2. BACKEND: Validation Python & Django
  # ===========================================================================
  backend-ci:
    name: Backend (Python & Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilation syntaxique des modules Python
        run: |
          python -m py_compile config/settings.py
          python -m py_compile accounts/models.py
          python -m py_compile accounts/serializers.py
          python -m py_compile accounts/views.py
          python -m py_compile requests_app/models.py
          python -m py_compile requests_app/serializers.py
          python -m py_compile requests_app/views.py

      - name: Validation du chargement Django
        env:
          SECRET_KEY: django-ci-synthetic-validation-key-random-918237
          DEBUG: 'True'
          DATABASE_URL: sqlite:///ci_test_db.sqlite3
        run: |
          python -c "import config.settings as s; print('Django settings loaded successfully')"

  # ===========================================================================
  # 3. DOCKER: Validation des images de conteneurs
  # ===========================================================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validation du build Backend Docker (Multi-stage non-root)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: uqo-backend:ci-test

      - name: Validation du build Frontend Docker (Multi-stage Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: uqo-frontend:ci-test
