# =============================================================================
# Docker Compose - UQO-Requests (Production)
# Orchestration des services: PostgreSQL, Backend Django REST et Frontend Nginx
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # BASE DE DONNEES POSTGRESQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: uqo_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uqo_requests_db}
      POSTGRES_USER: ${POSTGRES_USER:-uqo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uqo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uqo_user} -d ${POSTGRES_DB:-uqo_requests_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # BACKEND DJANGO REST FRAMEWORK
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uqo_backend
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_USER:-uqo_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uqo_requests_db}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://frontend}
      - ACCESS_TOKEN_LIFETIME=${ACCESS_TOKEN_LIFETIME:-60}
      - REFRESH_TOKEN_LIFETIME=${REFRESH_TOKEN_LIFETIME:-1440}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uqo_network
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FRONTEND REACT (SERVI PAR NGINX)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: uqo_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uqo_network
    restart: unless-stopped

# -----------------------------------------------------------------------------
# RESEAU INTERNE D'ISOLATION
# -----------------------------------------------------------------------------
networks:
  uqo_network:
    driver: bridge
    name: uqo_network

# -----------------------------------------------------------------------------
# VOLUMES PERSISTANTS
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: uqo_postgres_data
