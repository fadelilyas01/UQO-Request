<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none" role="img" aria-label="Logo officiel Université du Québec en Outaouais">
  <defs>
    <linearGradient id="uqoGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006341" />
      <stop offset="100%" stop-color="#028256" />
    </linearGradient>
    <linearGradient id="uqoGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A396" />
      <stop offset="100%" stop-color="#4FD1C5" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#006341" />
    </filter>
  </defs>

  <!-- Emblème UQO / Symbole Graphique Universitaire -->
  <g transform="translate(4, 8)" filter="url(#subtleGlow)">
    <!-- Arc Extérieur -->
    <path d="M 32 4 A 28 28 0 1 0 60 32 L 48 32 A 16 16 0 1 1 32 16 L 32 4 Z" fill="url(#uqoGradPrimary)" />
    <!-- Vague Dynamique / Accent Outaouais -->
    <path d="M 32 16 A 16 16 0 0 1 48 32 C 48 40.84 40.84 48 32 48 C 23.16 48 16 40.84 16 32 C 16 26.5 19 21.5 24 18.5 L 24 26 C 21.5 27.5 20 30 20 32 C 20 38.6 25.4 44 32 44 C 38.6 44 44 38.6 44 32 L 32 32 Z" fill="url(#uqoGradAccent)" />
    <!-- Point central / Flamme du Savoir -->
    <circle cx="32" cy="32" r="5" fill="#006341" />
  </g>

  <!-- Typographie Institutionnelle UQO -->
  <g transform="translate(82, 0)">
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="currentColor">
      UQO
    </text>
    <text x="88" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="0.5" fill="#006341">
      REQUESTS
    </text>
    <text x="1" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.4" fill="currentColor" opacity="0.75">
      UNIVERSITÉ DU QUÉBEC EN OUTAOUAIS
    </text>
  </g>
</svg>
